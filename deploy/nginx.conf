# /etc/nginx/sites-available/rue-des-bouchers (CT 105)
server {
    listen 8090 default_server;
    listen [::]:8090 default_server;
    server_name _;

    root /var/www/rue-des-bouchers/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite hashes everything under /assets: cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html and other entry points: always revalidate so new deploys show up
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
