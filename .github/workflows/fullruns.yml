name: Full runs

# Campagnes complètes de 14 jours par l'interface (3 styles) + estimation de durée (qa/duration.md).
# Trop lent pour chaque push : tous les jours à 3h UTC et à la demande (Actions → Full runs → Run workflow).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  fullruns:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full campaigns (legal, reckless, diplomat)
        run: npm run test:fullrun
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullruns
          path: |
            test-results/
            qa/duration.md
          if-no-files-found: ignore
