name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (sim, invariants, names, perf)
        run: npm test
      - name: Campaign simulator smoke (6 bots, invariants)
        run: npm run sim -- --runs 20
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (build + vite preview + headless Chromium)
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore
