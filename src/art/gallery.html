<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galerie art · Rue des Bouchers</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 13px system-ui, sans-serif; background: #15171c; color: #eee; display: flex; height: 100vh; overflow: hidden; }
    #side { width: 330px; overflow-y: auto; padding: 10px; box-sizing: border-box; background: #1d2027; border-right: 1px solid #2c303a; }
    #main { flex: 1; position: relative; }
    canvas#view { width: 100%; height: 100%; display: block; }
    h1 { font-size: 16px; margin: 4px 0 8px; color: #f0c36a; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #9aa3b5; margin: 14px 0 6px; }
    button { background: #2b303b; color: #eee; border: 1px solid #3a404d; border-radius: 6px; padding: 4px 8px; margin: 2px; cursor: pointer; font: inherit; }
    button:hover { background: #3a4150; }
    #portraits { position: absolute; inset: 0; overflow: auto; background: #15171c; display: none; padding: 12px; }
    #portraits table { border-collapse: collapse; }
    #portraits td, #portraits th { padding: 2px; text-align: center; font-size: 11px; color: #9aa3b5; }
    #portraits img { width: 96px; height: 96px; border-radius: 10px; display: block; }
    #note { position: absolute; left: 10px; top: 8px; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="side"><h1>Galerie art v0.5</h1><p>Cliquer d'abord n'importe où pour activer le son.</p></div>
  <div id="main"><canvas id="view"></canvas><div id="note"></div><div id="portraits"></div></div>
  <script type="module" src="./gallery.js"></script>
</body>
</html>
